line-length = 100

[lint]
# D docstrings, C901/PLR091x size caps, S bandit checks, BLE no blind except, plus the usual hygiene sets
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "C901",
    "PLR0912", "PLR0913", "PLR0915", "RUF", "PERF", "PTH", "RET", "ARG", "A", "S", "BLE",
]
ignore = ["E501"]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
# test names describe themselves; a plain assert is the point of a test
"tests/**" = ["D", "S"]
